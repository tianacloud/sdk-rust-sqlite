[package]
name = "tiana-sdk-sqlite"
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/tianacloud/sdk-rust-sqlite"
description = "Tiana SQLite sessions over the generic Tiana Rust transport"
publish = false

[dependencies]
# Immutable GitHub revision; no sibling checkout or local patch is required.
tiana-sdk = { git = "https://github.com/tianacloud/sdk-rust.git", rev = "c1f5c9872bdea4aaa542d33f613e92e005ea03ff", version = "=0.1.0-dev.5" }
base64 = "=0.22.1"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
zeroize = "=1.8.2"
h2 = "=0.4.16"
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
